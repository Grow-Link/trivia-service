spring:
  datasource:
    url: jdbc:h2:mem:trivia;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop

growlink:
  jwt:
    secret: secreto-de-pruebas-trivia-service-de-32-bytes-o-mas

trivia:
  cierre-pregunta:
    # cortos para que las pruebas del barredor en tiempo real no tengan que esperar segundos
    margen-ms: 50
    intervalo-barredor-ms: 100
  salida:
    # corto para que la prueba de desconexion con gracia no tenga que esperar los 8s de produccion
    gracia-ms: 300
